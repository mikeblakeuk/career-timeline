<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mike Blake — CV</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f2630;
    --accent: #58a6ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --line: #30363d;
    --dot: #58a6ff;
    --timeline-line: #30363d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 14px;
  }

  a { color: var(--accent); text-decoration: none; }

  /* ── page wrapper ── */
  .page {
    max-width: 860px;
    margin: 40px auto;
    padding: 0 24px 60px;
  }

  /* ── header ── */
  .cv-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 36px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .cv-header h1 {
    font-size: 2em;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .cv-header .subtitle {
    font-size: 1.05em;
    color: var(--accent);
    margin-top: 2px;
  }
  .cv-header .meta {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.88em;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cv-header .links {
    text-align: right;
    font-size: 0.88em;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    white-space: nowrap;
    padding-top: 4px;
  }
  .cv-header .links a { color: var(--accent); }

  /* ── section heading ── */
  .section-heading {
    font-size: 0.72em;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  /* ── skills ── */
  .skills-section { margin-bottom: 36px; }
  .skills-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .skill-pill {
    font-size: 0.82em;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .skill-pill.highlight {
    border-color: rgba(88,166,255,.5);
    color: var(--accent);
    background: rgba(88,166,255,.08);
  }

  .tl-entries {
    position: relative;
    padding-left: 120px;
  }

  /* the vertical line */
  .tl-entries::before {
    content: '';
    position: absolute;
    left: 108px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--timeline-line);
  }

  .tl-entry {
    position: relative;
    margin-bottom: 28px;
  }
  .tl-entry:last-child { margin-bottom: 0; }

  /* dot on the line */
  .tl-dot {
    position: absolute;
    left: -18px;
    top: 18px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot);
    border: 2px solid var(--bg);
    z-index: 1;
  }
  .tl-dot.contract {
    background: transparent;
    border-color: var(--dot);
  }

  .tl-content {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .tl-title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
  }
  .tl-logo {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    object-fit: contain;
    flex-shrink: 0;
    background: var(--panel-2);
    padding: 6px;
    border: 1px solid var(--line);
  }
  .tl-title {
    font-weight: 600;
    font-size: 0.97em;
    color: var(--text);
  }
  .tl-contract-badge {
    font-size: 0.68em;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .tl-company {
    font-size: 0.88em;
    color: var(--accent);
    margin-bottom: 1px;
  }
  .tl-location {
    font-size: 0.78em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .tl-bullets {
    padding-left: 16px;
    margin-bottom: 8px;
  }
  .tl-bullets li {
    font-size: 0.88em;
    color: var(--text);
    margin-bottom: 4px;
    opacity: 0.9;
  }
  .tl-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .tl-tag {
    font-size: 0.72em;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
  }

  /* ── clients ── */
  .tl-clients {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .tl-clients-label {
    font-size: 0.72em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 2px;
  }
  .tl-client {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.8em;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px 2px 4px;
  }
  .tl-client img {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    object-fit: contain;
  }

  /* ── certs ── */
  .certs-section { margin-bottom: 36px; }
  .cert-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cert-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88em;
  }
  .cert-date {
    width: 72px;
    flex-shrink: 0;
    color: var(--muted);
    font-size: 0.9em;
  }
  .cert-label { color: var(--text); }

  /* ── nav link back ── */
  .back-link {
    display: inline-block;
    margin-bottom: 28px;
    font-size: 0.82em;
    color: var(--muted);
  }
  .back-link:hover { color: var(--accent); }

  /* ── print styles ── */
  @media print {
    :root {
      --bg: #fff;
      --panel: #f6f8fa;
      --panel-2: #f0f2f5;
      --accent: #0969da;
      --text: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --dot: #0969da;
      --timeline-line: #d0d7de;
    }
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .back-link { display: none; }
    .page { margin: 0; padding: 12px 28px 28px; max-width: none; }
    .tl-entry { page-break-inside: avoid; break-inside: avoid; transform: none !important; opacity: 1 !important; }
    .section-heading { page-break-after: avoid; break-after: avoid; }
    .tl-logo { width: 36px !important; height: 36px !important; }
    a { color: var(--accent); }
    .skill-pill, .tl-tag, .tl-client { border: 1px solid var(--line); }
  }

  @media (max-width: 600px) {
    .tl-entries { padding-left: 90px; }
    .tl-entries::before { left: 78px; }
    .tl-date { width: 68px; font-size: 0.72em; }
    .cv-header { flex-direction: column; }
    .cv-header .links { text-align: left; align-items: flex-start; }
  }
</style>
</head>

// ── helpers ──────────────────────────────────────────────────────────────────

function toDate(s) {
  if (!s) return new Date();
  const [y, m] = s.split('-').map(Number);
  return new Date(y, m - 1, 1);
}
function fmtYear(s) {
  if (!s) return 'Present';
  return toDate(s).getFullYear();
}
function fmtMonthYear(s) {
  if (!s) return 'Present';
  return toDate(s).toLocaleString('en-GB', { month: 'short', year: 'numeric' });
}
function durationLabel(s, e) {
  const sd = toDate(s);
  const ed = e ? toDate(e) : new Date();
  let months = (ed.getFullYear() - sd.getFullYear()) * 12 + (ed.getMonth() - sd.getMonth());
  const y = Math.floor(months / 12), m = months % 12;
  const parts = [];
  if (y) parts.push(`${y} yr${y > 1 ? 's' : ''}`);
  if (m) parts.push(`${m} mo`);
  return parts.join(' ') || '<1 mo';
}

// ── render timeline entries ───────────────────────────────────────────────────

const PX_PER_YEAR = 100;

function renderEntries(list, containerId) {
  const container = document.getElementById(containerId);

  list.forEach(r => {
    const entry = document.createElement('div');
    entry.className = 'tl-entry';

    // dot
    const dot = document.createElement('div');
    dot.className = 'tl-dot' + (r.contract ? ' contract' : '');
    entry.appendChild(dot);

    // content
    const content = document.createElement('div');
    content.className = 'tl-content';

    // title row
    const titleRow = document.createElement('div');
    titleRow.className = 'tl-title-row';
    if (r.logo) {
      const img = document.createElement('img');
      img.className = 'tl-logo';
      img.src = r.logo;
      img.alt = '';
      titleRow.appendChild(img);
    }
    const titleEl = document.createElement('span');
    titleEl.className = 'tl-title';
    titleEl.textContent = r.title;
    titleRow.appendChild(titleEl);
    if (r.contract) {
      const badge = document.createElement('span');
      badge.className = 'tl-contract-badge';
      badge.textContent = 'Contract';
      titleRow.appendChild(badge);
    }
    content.appendChild(titleRow);

    // company
    const companyEl = document.createElement('div');
    companyEl.className = 'tl-company';
    companyEl.textContent = r.company;
    content.appendChild(companyEl);

    // location + duration
    const locEl = document.createElement('div');
    locEl.className = 'tl-location';
    locEl.textContent = `${r.location} · ${fmtMonthYear(r.start)} – ${fmtMonthYear(r.end)} · ${durationLabel(r.start, r.end)}`;
    content.appendChild(locEl);

    // bullets
    if (r.bullets && r.bullets.length) {
      const ul = document.createElement('ul');
      ul.className = 'tl-bullets';
      r.bullets.forEach(b => {
        const li = document.createElement('li');
        li.textContent = b;
        ul.appendChild(li);
      });
      content.appendChild(ul);
    }

    // tags
    if (r.tags && r.tags.length) {
      const tagsEl = document.createElement('div');
      tagsEl.className = 'tl-tags';
      r.tags.forEach(t => {
        const tag = document.createElement('span');
        tag.className = 'tl-tag';
        tag.textContent = t;
        tagsEl.appendChild(tag);
      });
      content.appendChild(tagsEl);
    }

    // clients
    if (r.clients && r.clients.length) {
      const clientsEl = document.createElement('div');
      clientsEl.className = 'tl-clients';
      const lbl = document.createElement('span');
      lbl.className = 'tl-clients-label';
      lbl.textContent = 'Clients:';
      clientsEl.appendChild(lbl);
      r.clients.forEach(c => {
        const chip = document.createElement('div');
        chip.className = 'tl-client';
        const img = document.createElement('img');
        img.src = c.logo;
        img.alt = '';
        chip.appendChild(img);
        const name = document.createElement('span');
        name.textContent = c.name;
        chip.appendChild(name);
        clientsEl.appendChild(chip);
      });
      content.appendChild(clientsEl);
    }

    entry.appendChild(content);
    container.appendChild(entry);
  });
}

});
