  .legend span {

    color: var(--muted); display: inline-block; margin: 2px 4px 2px 0;
  }

  /* horizontal scroll container */
  .scroll-wrap {
    overflow-x: auto;
    overflow-y: visible;
    padding: 10px 20px;
  }
  .scroll-wrap::-webkit-scrollbar { height: 12px; }
  .scroll-wrap::-webkit-scrollbar-track { background: var(--panel); border-radius: 8px; }
  .scroll-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .scroll-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .timeline {
    position: relative;
    margin: 0 auto;
  }
  /* central horizontal axis (uses --axis-y so JS can shift it when elements need to grow upward) */
  .timeline::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: var(--axis-y, 230px);
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--line) 4%, var(--line) 96%, transparent);
    transform: translateY(-50%);
    border-radius: 2px;
    z-index: 0;
  }

  /* year tick labels */
  .year-tick {
    position: absolute;
    top: 230px;
    transform: translate(-50%, -50%);
    background: var(--bg);
    color: var(--muted);
    font-size: 0.78em;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    z-index: 1;
    white-space: nowrap;
  }
  .year-tick.decade {
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* role bar = horizontal coloured pill below the axis */
  .role-bar {
    position: absolute;
    height: 18px;
    border-radius: 9px;
    opacity: 0.95;
    z-index: 2;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;

  .role-bar.dim { opacity: .2; filter: grayscale(.7); }

  /* project bar = thin secondary stripe just below the parent role */
  .project-bar {
    position: absolute;
    height: 10px;
    border-radius: 5px;
    opacity: 0.85;
    z-index: 2;
    border: 1px solid rgba(255,255,255,.15);

    border-radius: 7px;
    background: linear-gradient(90deg, rgba(88,166,255,.3), rgba(88,166,255,.5));

    border-radius: 8px;

    z-index: 2;

    background: var(--accent);
    border: 3px solid var(--bg);

// --- helpers ---
function toDate(s) {
  if (!s) return new Date();
  const [y,m] = s.split('-').map(Number);
  return new Date(y, m-1, 1);
}
function fmtMonth(s) {
  if (!s) return 'Present';
  return toDate(s).toLocaleString('en-GB', { month: 'short', year: 'numeric' });
}
function fmtRange(start, end) { return `${fmtMonth(start)} – ${fmtMonth(end)}`; }
function durationLabel(s, e) {
  const sd = toDate(s);
  const ed = e ? toDate(e) : new Date();
  let months = (ed.getFullYear() - sd.getFullYear()) * 12 + (ed.getMonth() - sd.getMonth());
  const y = Math.floor(months/12), m = months % 12;
  const parts = [];
  if (y) parts.push(`${y} yr${y>1?'s':''}`);
  if (m) parts.push(`${m} month${m>1?'s':''}`);
  return parts.join(' ') || '<1 month';
}

// --- horizontal scale (fit to viewport width) ---
const minDate = toDate('1995-01');
const maxDate = new Date();
maxDate.setDate(1);
const LEFT_PAD = 30, RIGHT_PAD = 30;
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
const totalMonths = monthsBetween(minDate, maxDate);
const scrollWrap = document.querySelector('.scroll-wrap');
const VIEWPORT_W = Math.max(800, scrollWrap.clientWidth - 40);
const BASE_PX_PER_MONTH = (VIEWPORT_W - LEFT_PAD - RIGHT_PAD) / totalMonths;
let pxPerMonth = BASE_PX_PER_MONTH;

const timeline = document.getElementById('timeline');
const AXIS_Y = 230;
let showExams = true;
let showTraining = true;

function xPx(d) { return LEFT_PAD + monthsBetween(minDate, d) * pxPerMonth; }

// --- logo color extraction ---
const logoColorCache = {};
function extractLogoColor(url) {
  if (!url) return Promise.resolve(null);
  if (logoColorCache[url]) return Promise.resolve(logoColorCache[url]);
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth || 32;
        c.height = img.naturalHeight || 32;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, c.width, c.height).data;
        const buckets = {};
        let bestKey = null, bestScore = -1;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 200) continue;
          // skip near-white, near-black, and near-grey
          const max = Math.max(r,g,b), min = Math.min(r,g,b);
          if (max > 240 && min > 240) continue;
          if (max < 30) continue;
          if (max - min < 25) continue;
          // bucket to nearest 32
          const key = `${r>>5},${g>>5},${b>>5}`;
          const entry = buckets[key] || (buckets[key] = { r:0, g:0, b:0, n:0 });
          entry.r += r; entry.g += g; entry.b += b; entry.n++;
          const sat = (max - min);
          const score = entry.n * (1 + sat / 80);
          if (score > bestScore) { bestScore = score; bestKey = key; }
        }
        if (!bestKey) { resolve(null); return; }
        const e = buckets[bestKey];
        const color = { r: Math.round(e.r/e.n), g: Math.round(e.g/e.n), b: Math.round(e.b/e.n) };
        logoColorCache[url] = color;
        resolve(color);
      } catch (err) {
        resolve(null);
      }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}
function rgb(c) { return `rgb(${c.r},${c.g},${c.b})`; }
function shade(c, pct) {
  const f = pct < 0 ? 0 : 255, t = Math.abs(pct);
  return { r: Math.round((f - c.r) * t + c.r), g: Math.round((f - c.g) * t + c.g), b: Math.round((f - c.b) * t + c.b) };
}
function applyLogoColor(el, logoUrl) {
  extractLogoColor(logoUrl).then(c => {
    if (!c) return;
    const c2 = shade(c, 0.15);
    el.style.background = `linear-gradient(90deg, ${rgb(c)}, ${rgb(c2)})`;
  });
}
function applyRoleColor(roleId, logoUrl) {
  extractLogoColor(logoUrl).then(c => {
    if (!c) return;
    const c2 = shade(c, 0.15);
    document.querySelectorAll(`.role-bar[data-id="${roleId}"]`).forEach(el => {
      el.style.background = `linear-gradient(90deg, ${rgb(c)}, ${rgb(c2)})`;
    });
    document.querySelectorAll(`.role-card[data-id="${roleId}"]`).forEach(el => {
      el.style.borderColor = rgb(c);
      el.style.background = `linear-gradient(180deg, rgba(${c.r},${c.g},${c.b},0.18), rgba(${c.r},${c.g},${c.b},0.06))`;
    });
  });
}

// --- collision helpers ---
function elBox(el) {
  const er = el.getBoundingClientRect();
  const tr = timeline.getBoundingClientRect();
  return { left: er.left - tr.left, top: er.top - tr.top, right: er.right - tr.left, bottom: er.bottom - tr.top };
}
function rectOverlap(a, b, m = 4) {
  return !(a.right + m < b.left || a.left > b.right + m || a.bottom + m < b.top || a.top > b.bottom + m);
}
function pushAway(el, occupied, direction, step = 4, maxIter = 400) {
  let rect = elBox(el);
  let iter = 0;
  while (occupied.some(o => rectOverlap(rect, o)) && iter++ < maxIter) {
    const curTop = parseFloat(el.style.top) || 0;
    el.style.top = (curTop + (direction === 'up' ? -step : step)) + 'px';
    rect = elBox(el);
  }
  occupied.push(rect);
  return rect;
}

function render() {
  timeline.innerHTML = '';
  timeline.style.setProperty('--axis-y', AXIS_Y + 'px');
  const totalWidth = LEFT_PAD + totalMonths * pxPerMonth + RIGHT_PAD;
  timeline.style.width = totalWidth + 'px';
  // give the timeline a generous initial height so post-render measurement works
  timeline.style.height = '900px';

  const occAbove = [];   // rects in the above-axis zone (push 'up')
  const occBelow = [];   // rects in the below-axis zone (push 'down')

  // year ticks
  const yearStep = pxPerMonth * 12 < 30 ? 10 : pxPerMonth * 12 < 60 ? 5 : 1;
  const yearTickRects = [];
  for (let y = minDate.getFullYear(); y <= maxDate.getFullYear(); y++) {
    const isDecade = (y % 10 === 0);
    if (y % yearStep !== 0 && !isDecade) continue;
    const lbl = document.createElement('div');
    lbl.className = 'year-tick' + (isDecade ? ' decade' : '');
    lbl.textContent = y;
    lbl.style.left = xPx(new Date(y, 0, 1)) + 'px';
    timeline.appendChild(lbl);
    yearTickRects.push(elBox(lbl));
  }
  // reserve year-tick space in both zones so nothing crosses the axis
  occAbove.push(...yearTickRects);
  occBelow.push(...yearTickRects);

  // life bands (above)
  lifeBands.forEach(b => {
    const left = xPx(toDate(b.start));
    const width = xPx(toDate(b.end)) - left;
    const band = document.createElement('div');
    band.className = 'life-band';
    band.style.left = left + 'px';
    band.style.width = width + 'px';
    band.style.top = (AXIS_Y - 90) + 'px';
    timeline.appendChild(band);
    occAbove.push(elBox(band));

    const lbl = document.createElement('div');
    lbl.className = 'life-band-label';
    lbl.textContent = `${b.icon} ${b.label} · ${durationLabel(b.start, b.end)}`;
    lbl.style.left = (left + width/2) + 'px';
    lbl.style.top = (AXIS_Y - 100) + 'px';
    lbl.style.transform = 'translate(-50%, -100%)';
    timeline.appendChild(lbl);
    pushAway(lbl, occAbove, 'up');
  });

  // role bars (fixed Y, reserve space)
  const ROLE_BAR_Y = AXIS_Y + 20;
  const PROJECT_BAR_Y = ROLE_BAR_Y + 26;
  const sortedRoles = [...roles].sort((a,b) => toDate(a.start) - toDate(b.start));
  const roleBarEls = [];
  sortedRoles.forEach(r => {
    const left = xPx(toDate(r.start));
    const right = xPx(r.end ? toDate(r.end) : maxDate);
    const width = Math.max(8, right - left - 2);
    const bar = document.createElement('div');
    bar.className = 'role-bar ' + r.cls;
    bar.style.left = (left + 1) + 'px';
    bar.style.width = width + 'px';
    bar.style.top = ROLE_BAR_Y + 'px';
    bar.dataset.id = r.id;
    bar.title = `${r.title} · ${r.company} (${durationLabel(r.start, r.end)})`;
    bar.addEventListener('click', () => openModal(r));
    bar.addEventListener('mouseenter', () => showHoverDetail(r));
    timeline.appendChild(bar);
    occBelow.push(elBox(bar));
    roleBarEls.push({ r, left, right, width });
  });

  // project bars
  const projectEntries = [];
  projects.forEach(p => {
    const left = xPx(toDate(p.start));
    const right = xPx(p.end ? toDate(p.end) : maxDate);
    const width = Math.max(8, right - left - 2);
    const bar = document.createElement('div');
    bar.className = 'project-bar ' + (p.cls || '');
    bar.style.left = (left + 1) + 'px';
    bar.style.width = width + 'px';
    bar.style.top = PROJECT_BAR_Y + 'px';
    bar.title = `${p.title} · ${durationLabel(p.start, p.end)}`;
    timeline.appendChild(bar);
    occBelow.push(elBox(bar));
    projectEntries.push({ p, left, right, width });
  });

  // milestone dots (fixed on axis)
  const sortedMilestones = [...milestones]
    .filter(m => {
      if (m.isExam) return showExams;
      if (m.isTraining) return showTraining;
      return true;
    })
    .sort((a,b) => toDate(a.date) - toDate(b.date));
  const milestoneEntries = [];
  sortedMilestones.forEach(m => {
    const x = xPx(toDate(m.date));
    const dot = document.createElement('div');
    dot.className = 'milestone-dot';
    dot.style.left = x + 'px';
    dot.style.top = AXIS_Y + 'px';
    timeline.appendChild(dot);
    milestoneEntries.push({ m, x });
  });

  // project labels — push down to avoid year ticks/bars/anything below them
  projectEntries.forEach(({ p, left, right, width }) => {
    if (width <= 80) return;
    const lbl = document.createElement('div');
    lbl.style.position = 'absolute';
    lbl.style.left = (left + width/2) + 'px';
    lbl.style.top = (PROJECT_BAR_Y + 16) + 'px';
    lbl.style.transform = 'translateX(-50%)';
    lbl.style.fontSize = '0.72em';
    lbl.style.color = 'var(--muted)';
    lbl.style.whiteSpace = 'nowrap';
    lbl.style.zIndex = '3';
    lbl.textContent = `${p.icon || '🔹'} ${p.title} · ${durationLabel(p.start, p.end)}`;
    timeline.appendChild(lbl);
    pushAway(lbl, occBelow, 'down');
  });

  // milestone labels — all above the axis so only jobs sit below
  const milestoneLabels = [];
  milestoneEntries.forEach(({ m, x }) => {
    const lbl = document.createElement('div');
    lbl.className = 'milestone-label';
    const logoHtml = m.logo ? `<img src="${m.logo}" style="width:24px;height:24px;border-radius:4px;background:#fff;padding:2px;display:block;margin:0 auto 4px" onerror="this.style.display='none'">` : `<span class="icon">${m.icon}</span>`;
    lbl.innerHTML = `${logoHtml}${m.label}`;
    lbl.style.left = x + 'px';
    lbl.style.top = (AXIS_Y - 28) + 'px';
    lbl.style.transform = 'translate(-50%, -100%)';
    timeline.appendChild(lbl);
    pushAway(lbl, occAbove, 'up');
    milestoneLabels.push({ lbl, x, above: true });
  });

  // pins connecting each milestone dot to its resolved label
  milestoneLabels.forEach(({ lbl, x, above }) => {
    const box = elBox(lbl);
    const pin = document.createElement('div');
    pin.className = 'milestone-pin';
    pin.style.left = (x - 1) + 'px';
    if (above) {
      pin.style.top = (box.bottom + 2) + 'px';
      pin.style.height = (AXIS_Y - box.bottom - 2) + 'px';
    } else {
      pin.style.top = AXIS_Y + 'px';
      pin.style.height = (box.top - AXIS_Y - 2) + 'px';
    }
    timeline.appendChild(pin);
  });

  // role cards — placed below their role bar; pushed down to avoid all prior below-zone content
  const CARD_W = 160;
  roleBarEls.forEach(({ r, left, right }) => {
    const cardLeft = Math.max(LEFT_PAD, Math.min(right - CARD_W, totalWidth - CARD_W - LEFT_PAD));
    const card = document.createElement('div');
    card.className = 'role-card';
    card.dataset.id = r.id;
    card.style.left = cardLeft + 'px';
    card.style.top = (ROLE_BAR_Y + 40) + 'px';
    card.innerHTML = `
      <div class="head">
        <img class="logo" src="${r.logo || ''}" alt="" onerror="this.classList.add('missing')">
        <div>
          <div class="company">${r.company}</div>
          <div class="title">${r.title}</div>
        </div>
      </div>
      <div class="duration">${durationLabel(r.start, r.end)}</div>
      ${r.clients && r.clients.length ? `<div class="clients">${r.clients.map(c => `<img src="${c.logo}" title="${c.name}" alt="${c.name}" onerror="this.classList.add('missing')">`).join('')}</div>` : ''}
    `;
    card.addEventListener('click', () => openModal(r));
    card.addEventListener('mouseenter', () => showHoverDetail(r));
    timeline.appendChild(card);
    pushAway(card, occBelow, 'down');
    applyRoleColor(r.id, r.logo);
  });

  // compute final timeline bounds — shift everything down if anything went above 0
  let minTop = 0, maxBottom = AXIS_Y + 80;
  occAbove.forEach(b => { if (b.top < minTop) minTop = b.top; });
  occBelow.forEach(b => { if (b.bottom > maxBottom) maxBottom = b.bottom; });
  if (minTop < 0) {
    const shift = -minTop + 16;
    Array.from(timeline.children).forEach(el => {
      const t = parseFloat(el.style.top);
      if (!isNaN(t)) el.style.top = (t + shift) + 'px';
    });
    timeline.style.setProperty('--axis-y', (AXIS_Y + shift) + 'px');
    maxBottom += shift;
  }
  timeline.style.height = (maxBottom + 24) + 'px';
}

render();

// --- hover detail panel ---
const hoverDetail = document.getElementById('hoverDetail');
function showHoverDetail(r) {
  const logoImg = r.logo ? `<img src="${r.logo}" alt="" onerror="this.style.display='none'">` : '';
  const bullets = (r.bullets || []).map(b => `<li>${b}</li>`).join('');
  const clients = (r.clients && r.clients.length)
    ? `<div><h5>Clients</h5>${r.clients.map(c => `<span class="chip"><img src="${c.logo}" alt="" onerror="this.style.display='none'">${c.name}</span>`).join('')}</div>`
    : '';
  const tags = (r.tags && r.tags.length)
    ? `<div><h5>Skills &amp; Tech</h5>${r.tags.map(t => `<span>${t}</span>`).join('')}</div>`
    : '';
  hoverDetail.innerHTML = `
    <div class="hd-head">
      ${logoImg}
      <div>
        <div class="hd-company">${r.company}</div>
        <div class="hd-title">${r.title}</div>
      </div>
    </div>
    <div class="hd-meta">${fmtRange(r.start, r.end)} · ${durationLabel(r.start, r.end)}</div>
    <ul>${bullets}</ul>
    <div class="hd-section">
      <div class="hd-clients">${clients}</div>
      <div class="hd-tags">${tags}</div>
    </div>
  `;
}
const toggleExamsBtn = document.getElementById('toggleExams');
toggleExamsBtn.addEventListener('click', () => {
  showExams = !showExams;
  toggleExamsBtn.classList.toggle('active', showExams);
  toggleExamsBtn.textContent = showExams ? '🎓 Hide certifications' : '🎓 Show certifications';
  render();
});
const toggleTrainingBtn = document.getElementById('toggleTraining');
toggleTrainingBtn.addEventListener('click', () => {
  showTraining = !showTraining;
  toggleTrainingBtn.classList.toggle('active', showTraining);
  toggleTrainingBtn.textContent = showTraining ? '⚙️ Hide training' : '⚙️ Show training';
  render();
});

// --- skill filters ---
const legend = document.getElementById('legend');
// curated/normalised top skills with display names
const skillGroups = [
  { label: 'C#',           match: ['c#'] },
  { label: '.NET',         match: ['.net'] },
  { label: 'Angular',      match: ['angular'] },
  { label: 'SQL Server',   match: ['sql server', 'sql 2008', 'sql'] },
  { label: 'Azure',        match: ['azure batch', 'azure storage', 'azure'] },
  { label: 'Power BI',     match: ['power bi'] },
  { label: 'Kubernetes',   match: ['kubernetes'] },
  { label: 'Microsoft Fabric', match: ['microsoft fabric', 'fabric'] },
  { label: 'Event Sourcing',   match: ['event sourcing'] },
  { label: 'CI/CD',        match: ['ci/cd', 'teamcity'] },
  { label: 'Testing',      match: ['nunit', 'selenium', 'unit tests'] },
  { label: 'ASP.NET MVC',  match: ['asp.net mvc 3', 'asp.net mvc'] },
  { label: 'Consultancy',  match: ['consultancy'] },
];

function rolesMatchingSkill(group) {
  const tokens = group.match.map(t => t.toLowerCase());
  return roles.filter(r => (r.tags || []).some(tag => {
    const t = tag.toLowerCase();
    return tokens.some(tok => t === tok || t.includes(tok));
  })).map(r => r.id);
}

let activeSkill = null;
function applySkillFilter() {
  const matchingIds = activeSkill ? rolesMatchingSkill(activeSkill) : null;
  document.querySelectorAll('.role-bar, .role-card').forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('dim', !!matchingIds && !matchingIds.includes(id));
  });
}

skillGroups.forEach(group => {
  if (rolesMatchingSkill(group).length === 0) return;
  const s = document.createElement('span');
  s.textContent = group.label;
  s.addEventListener('click', () => {
    if (activeSkill === group) {
      activeSkill = null;
      legend.querySelectorAll('span').forEach(el => el.classList.remove('active'));
    } else {
      activeSkill = group;
      legend.querySelectorAll('span').forEach(el => el.classList.remove('active'));
      s.classList.add('active');
    }
    applySkillFilter();
  });
  legend.appendChild(s);
});

// re-apply filter after every render (zoom rebuilds elements)
const _origRender = render;
render = function() { _origRender.apply(this, arguments); applySkillFilter(); };

// --- modal ---
const modalBg = document.getElementById('modalBg');
function openModal(r) {
  const logoImg = r.logo ? `<img src="${r.logo}" alt="" style="width:36px;height:36px;border-radius:6px;background:#fff;padding:3px;vertical-align:middle;margin-right:10px;object-fit:contain" onerror="this.style.display='none'">` : '';
  document.getElementById('mTitle').innerHTML = logoImg + r.company;
  document.getElementById('mCompany').textContent = r.title;
  document.getElementById('mMeta').textContent = `${fmtRange(r.start, r.end)} · ${durationLabel(r.start, r.end)}`;
  const ul = document.getElementById('mList');
  ul.innerHTML = '';
  r.bullets.forEach(b => { const li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
  const clientsHeader = document.getElementById('mClientsHeader');
  const clientsList = document.getElementById('mClients');
  clientsList.innerHTML = '';
  if (r.clients && r.clients.length) {
    clientsHeader.style.display = '';
    r.clients.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<img src="${c.logo}" alt="" onerror="this.style.display='none'">${c.name}`;
      clientsList.appendChild(chip);
    });
  } else {
    clientsHeader.style.display = 'none';
  }
  const tags = document.getElementById('mTags');
  tags.innerHTML = '';
  r.tags.forEach(t => { const s = document.createElement('span'); s.textContent = t; tags.appendChild(s); });
  modalBg.classList.add('open');
}
document.getElementById('closeBtn').addEventListener('click', () => modalBg.classList.remove('open'));
modalBg.addEventListener('click', e => { if (e.target === modalBg) modalBg.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modalBg.classList.remove('open'); });

// auto-reflow on resize
window.addEventListener('resize', () => location.reload());
</script>
