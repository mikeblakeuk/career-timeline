<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mike Blake — Career Timeline</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1f2630;
    --accent: #58a6ff;
    --accent-2: #79b8ff;
    --text: #e6edf3;
    --muted: #8b949e;
    --line: #30363d;
    --role: #58a6ff;
    --role-2: #1f6feb;
    --c-exam: #f0c674;
    --c-train: #b48ead;
    --c-project: #8fbc8f;
    --c-mile: #8b949e;
    --bg-grad-top: #1a2233;
  }
  [data-theme="light"] {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel-2: #eef2f7;
    --accent: #0969da;
    --accent-2: #218bff;
    --text: #1f2328;
    --muted: #57606a;
    --line: #d0d7de;
    --role: #0969da;
    --role-2: #0a3069;
    --c-exam: #bf8700;
    --c-train: #8250df;
    --c-project: #1a7f37;
    --c-mile: #6e7781;
    --bg-grad-top: #e6eef8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg-grad-top) 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 30px 0 40px;
    transition: background .25s, color .25s;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 20px;
    padding: 0 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 2.2em; letter-spacing: 0.4px; }
  header p { margin: 0; color: var(--muted); }

  .legend {
    max-width: 1100px;
    margin: 0 auto 18px;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    font-size: 0.85em;
  }
  .legend span {
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .legend span.active { color: var(--text); border-color: var(--accent); }

  .theme-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 1000;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, border-color .15s, color .15s, transform .15s;
  }
  .theme-toggle:hover { border-color: var(--accent); transform: scale(1.05); }

  .toggle-btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85em;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s, border-color .15s, color .15s;
  }
  .toggle-btn:hover { border-color: var(--accent); }
  .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* vertical card list (full details, newest first) */
  .card-list {
    max-width: 1100px;
    margin: 28px auto 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 20px;
  }
  .cl-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 16px 20px;
    scroll-margin-top: 16px;
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  .cl-card.flash { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,140,255,.35); background: var(--panel-2); }
  .cl-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; text-align: left; }
  .cl-logo { width: 42px; height: 42px; border-radius: 6px; background: #fff; padding: 3px; object-fit: contain; flex-shrink: 0; }
  .cl-logo.cl-icon { background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 22px; padding: 0; }
  .cl-company { font-size: 1.15em; font-weight: 700; }
  .cl-title { color: var(--muted); font-size: 0.9em; }
  .cl-meta { color: var(--accent); font-size: 0.78em; text-transform: uppercase; letter-spacing: .5px; margin: 4px 0 10px; font-weight: 600; }
  .cl-bullets { margin: 8px 0; padding-left: 22px; }
  .cl-bullets li { margin: 4px 0; line-height: 1.45; }
  .cl-section { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .cl-block { flex: 1; min-width: 240px; }
  .cl-block h5 { margin: 0 0 6px; font-size: 0.72em; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }
  .cl-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 4px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-size: 0.8em; margin: 2px 4px 2px 0;
  }
  .cl-chip img { width: 16px; height: 16px; border-radius: 3px; background: #fff; padding: 1px; object-fit: contain; }
  .cl-tag {
    font-size: 0.72em; padding: 2px 9px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--muted); display: inline-block; margin: 2px 4px 2px 0;
  }
  .cl-mile { border-left-color: var(--c-mile); }
  .cl-mile.cl-exam { border-left-color: var(--c-exam); }
  .cl-mile.cl-train { border-left-color: var(--c-train); }

  /* Light-mode: keep cards dark with white text for contrast */
  [data-theme="light"] .cl-card {
    background: #161b22;
    color: #e6edf3;
    border-color: #30363d;
  }
  [data-theme="light"] .cl-card.flash { background: #1f2630; }
  [data-theme="light"] .cl-title,
  [data-theme="light"] .cl-block h5,
  [data-theme="light"] .cl-tag { color: #8b949e; }
  [data-theme="light"] .cl-chip,
  [data-theme="light"] .cl-tag { background: #1f2630; border-color: #30363d; }
  .cl-project { border-left-color: var(--c-project); }
  .cl-role { border-left-color: var(--role); }

  /* clickable affordance on timeline elements */
  .role-bar, .project-bar, .milestone-dot, .role-card, .milestone-label { cursor: pointer; }

  /* mobile: tighten the vertical card list. The horizontal timeline is kept
     visible but scrolls horizontally (it's already inside .scroll-wrap). */
  @media (max-width: 720px) {
    body { padding: 14px 0; }
    header h1 { font-size: 1.4em; padding: 0 14px; }
    header p { font-size: 0.85em; padding: 0 14px; }
    .legend { display: none !important; }
    .scroll-wrap { padding: 6px 10px; overflow-x: hidden; scrollbar-width: none; }
    .scroll-wrap::-webkit-scrollbar { display: none; }
    .card-list { margin: 14px auto 24px; gap: 10px; padding: 0 12px; }
    .cl-card { padding: 12px 14px; border-radius: 8px; }
    .cl-head { gap: 10px; margin-bottom: 4px; }
    .cl-logo { width: 36px; height: 36px; }
    .cl-company { font-size: 1.02em; }
    .cl-title { font-size: 0.82em; }
    .cl-meta { font-size: 0.7em; margin: 2px 0 8px; }
    .cl-bullets { padding-left: 18px; font-size: 0.9em; }
    .cl-section { flex-direction: column; gap: 10px; }
    .cl-block { min-width: 0; }
    .cl-tag { font-size: 0.68em; }
    .toggle-btn { padding: 6px 10px; font-size: 0.78em; }
  }

  /* horizontal scroll container */
  .scroll-wrap {
    overflow-x: auto;
    overflow-y: visible;
    padding: 10px 20px;
  }
  .scroll-wrap::-webkit-scrollbar { height: 12px; }
  .scroll-wrap::-webkit-scrollbar-track { background: var(--panel); border-radius: 8px; }
  .scroll-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .scroll-wrap::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .timeline {
    position: relative;
    margin: 0 auto;
  }
  /* axis line drawn in SVG */
  .timeline::before { display: none; }

  /* year tick labels — sit just BELOW the axis (jobs are above) */
  .year-tick {
    position: absolute;
    top: calc(var(--axis-y, 230px) + 4px);
    transform: translateX(-50%);
    background: var(--bg);
    color: var(--text);
    font-size: 0.82em;
    font-weight: 600;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    z-index: 3;
    white-space: nowrap;
  }
  .year-tick.decade {
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* role bar = horizontal coloured pill below the axis */
  .role-bar {
    position: absolute;
    height: 18px;
    border-radius: 9px;
    opacity: 0.95;
    z-index: 2;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .role-bar:hover { transform: translateY(1px); box-shadow: 0 4px 12px rgba(0,0,0,.6); }
  .role-bar.dim { opacity: .2; filter: grayscale(.7); }
  .role-bar.contract { background: repeating-linear-gradient(45deg, var(--role-2) 0 8px, var(--role) 8px 16px); }
  .contract-badge {
    display: inline-block; margin-left: 6px;
    padding: 1px 7px; border-radius: 999px;
    background: rgba(255,255,255,.15); color: #fff;
    font-size: 0.62em; font-weight: 600;
    text-transform: uppercase; letter-spacing: .5px;
    vertical-align: middle;
  }

  /* project bar = thin secondary stripe just below the parent role */
  .project-bar {
    position: absolute;
    height: 18px;
    border-radius: 9px;
    opacity: 0.85;
    z-index: 2;
    border: 1px solid rgba(255,255,255,.15);
  }

  /* life band = above the axis */
  .life-band {
    position: absolute;
    height: 18px;
    border-radius: 9px;
    background: linear-gradient(90deg, rgba(88,166,255,.3), rgba(88,166,255,.5));
    border: 1px solid rgba(88,166,255,.6);
    z-index: 2;
  }
  .skill-band {
    position: absolute;
    height: 18px;
    border-radius: 9px;
    background: linear-gradient(90deg, rgba(168,85,247,.45), rgba(168,85,247,.7));
    border: 1px solid rgba(168,85,247,.7);
    z-index: 2;
  }
  .skill-band-label {
    position: absolute;
    color: #c4a7ef;
    font-size: 0.72em;
    white-space: nowrap;
    padding: 1px 6px;
    background: rgba(20, 14, 32, 0.85);
    border: 1px solid rgba(168,85,247,.5);
    border-radius: 4px;
    z-index: 3;
  }
  .life-band-label {
    position: absolute;
    color: var(--accent);
    font-size: 0.82em;
    white-space: nowrap;
    padding: 2px 8px;
    background: var(--panel);
    border: 1px solid rgba(88,166,255,.4);
    border-radius: 8px;
    z-index: 3;
  }

  /* milestone = vertical pin from axis */
  .milestone-pin {
    position: absolute;
    width: 2px;
    background: var(--accent);
    z-index: 2;
  }
  .milestone-dot {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent);
    z-index: 3;
    transform: translate(-50%, -50%);
  }
  .milestone-label {
    position: absolute;
    color: var(--text);
    font-size: 0.78em;
    padding: 6px 10px;
    background: var(--panel-2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    z-index: 3;
    transform: translateX(-50%);
    text-align: center;
    max-width: 180px;
    line-height: 1.3;
  }
  .milestone-label .icon { display: block; font-size: 1.4em; margin-bottom: 2px; }

  /* role card — icon only */
  .role-card {
    position: absolute;
    width: 40px;
    height: 40px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
    z-index: 4;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .role-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .role-card.dim { opacity: .35; filter: grayscale(.6); }
  .role-card .logo {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: #fff;
    object-fit: contain;
    padding: 2px;
  }
  .role-card .logo.missing { display: none; }

  /* clients section in modal */
  .modal .clients-list { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .modal .clients-list .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 4px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-size: 0.85em;
  }
  .modal .clients-list .chip img {
    width: 18px; height: 18px; border-radius: 3px;
    background: #fff; padding: 1px; object-fit: contain;
  }
  .modal h4 { margin: 16px 0 6px 0; font-size: 0.85em; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; }

  /* connector lines from each card to its bar — drawn as three positioned segments */
  .card-connector {
    position: absolute;
    background: var(--line);
    z-index: 1;
    pointer-events: none;
  }
  .card-connector.h { height: 1.5px; }
  .card-connector.v { width: 1.5px; }

  /* color classes */
  .c-milliman, .c-1touch, .c-rbs, .c-benefex,
  .c-taylormade, .c-imeta, .c-silversands, .c-solent, .c-iwcollege {
    background: var(--role);
  }
  .c-powerbi {
    background: linear-gradient(90deg, rgba(242,200,17,.45), rgba(242,200,17,.7));
    border-color: rgba(242,200,17,.7) !important;
  }

  /* modal */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    max-width: 720px;
    width: 100%;
    padding: 26px 28px;
    box-shadow: 0 18px 60px rgba(0,0,0,.6);
    animation: pop .18s ease-out;
    position: relative;
  }
  @keyframes pop {
    from { transform: scale(.95); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .modal h2 { margin: 0 0 4px; font-size: 1.5em; }
  .modal .sub { color: var(--muted); margin-bottom: 4px; }
  .modal .meta { color: var(--accent); font-size: 0.9em; margin-bottom: 16px; }
  .modal ul { margin: 0; padding-left: 20px; line-height: 1.55; }
  .modal ul li { margin-bottom: 8px; }
  .modal .tags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .modal .tags span {
    font-size: 0.75em;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .close-btn {
    position: absolute;
    top: 14px;
    right: 18px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.8em;
    cursor: pointer;
    line-height: 1;
  }

  footer {
    text-align: center;
    color: var(--muted);
    margin-top: 30px;
    font-size: 0.82em;
    padding: 0 20px;
  }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.85em;
    margin: 8px 0 4px;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark">🌙</button>

<header>
  <h1>Mike Blake — Career Timeline</h1>
  <p>Click a role for details</p>
</header>

<div class="legend" id="legend" style="display:none"></div>

<div style="text-align:center; margin: 0 auto 14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
  <button id="toggleExams" class="toggle-btn">🎓 Show certifications</button>
  <button id="toggleProjects" class="toggle-btn">🔹 Show projects</button>
</div>

<div class="scroll-wrap">
  <div class="timeline" id="timeline"></div>
</div>

<div id="cardList" class="card-list"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
    <h2 id="mTitle"></h2>
    <div class="sub" id="mCompany"></div>
    <div class="meta" id="mMeta"></div>
    <ul id="mList"></ul>
    <h4 id="mClientsHeader" style="display:none">Clients</h4>
    <div class="clients-list" id="mClients"></div>
    <div class="tags" id="mTags"></div>
  </div>
</div>

<footer>Built as a single self-contained HTML file</footer>

// --- helpers ---
function toDate(s) {
  if (!s) return new Date();
  const [y,m] = s.split('-').map(Number);
  return new Date(y, m-1, 1);
}
function fmtMonth(s) {
  if (!s) return 'Present';
  return toDate(s).toLocaleString('en-GB', { month: 'short', year: 'numeric' });
}
function fmtRange(start, end) { return `${fmtMonth(start)} – ${fmtMonth(end)}`; }
function hexToRgba(hex, alpha = 1) {
  const m = /^#?([0-9a-f]{6}|[0-9a-f]{3})$/i.exec(hex);
  if (!m) return hex;
  let h = m[1];
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const r = parseInt(h.slice(0,2), 16);
  const g = parseInt(h.slice(2,4), 16);
  const b = parseInt(h.slice(4,6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function durationLabel(s, e) {
  const sd = toDate(s);
  const ed = e ? toDate(e) : new Date();
  let months = (ed.getFullYear() - sd.getFullYear()) * 12 + (ed.getMonth() - sd.getMonth());
  const y = Math.floor(months/12), m = months % 12;
  const parts = [];
  if (y) parts.push(`${y} yr${y>1?'s':''}`);
  if (m) parts.push(`${m} month${m>1?'s':''}`);
  return parts.join(' ') || '<1 month';
}

// --- logo color extraction ---
const logoColorCache = {};
function extractLogoColor(url) {
  if (!url) return Promise.resolve(null);
  if (logoColorCache[url]) return Promise.resolve(logoColorCache[url]);
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth || 32;
        c.height = img.naturalHeight || 32;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, c.width, c.height).data;
        const buckets = {};
        let bestKey = null, bestScore = -1;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 200) continue;
          // skip near-white, near-black, and near-grey
          const max = Math.max(r,g,b), min = Math.min(r,g,b);
          if (max > 240 && min > 240) continue;
          if (max < 30) continue;
          if (max - min < 25) continue;
          // bucket to nearest 32
          const key = `${r>>5},${g>>5},${b>>5}`;
          const entry = buckets[key] || (buckets[key] = { r:0, g:0, b:0, n:0 });
          entry.r += r; entry.g += g; entry.b += b; entry.n++;
          const sat = (max - min);
          const score = entry.n * (1 + sat / 80);
          if (score > bestScore) { bestScore = score; bestKey = key; }
        }
        if (!bestKey) { resolve(null); return; }
        const e = buckets[bestKey];
        const color = { r: Math.round(e.r/e.n), g: Math.round(e.g/e.n), b: Math.round(e.b/e.n) };
        logoColorCache[url] = color;
        resolve(color);
      } catch (err) {
        resolve(null);
      }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}
function rgb(c) { return `rgb(${c.r},${c.g},${c.b})`; }
function shade(c, pct) {
  const f = pct < 0 ? 0 : 255, t = Math.abs(pct);
  return { r: Math.round((f - c.r) * t + c.r), g: Math.round((f - c.g) * t + c.g), b: Math.round((f - c.b) * t + c.b) };
}
function applyLogoColor(el, logoUrl) {
  extractLogoColor(logoUrl).then(c => {
    if (!c) return;
    const c2 = shade(c, 0.15);
    el.style.background = `linear-gradient(90deg, ${rgb(c)}, ${rgb(c2)})`;
  });
}

// --- collision helpers ---
function elBox(el) {
  const er = el.getBoundingClientRect();
  const tr = timeline.getBoundingClientRect();
  return { left: er.left - tr.left, top: er.top - tr.top, right: er.right - tr.left, bottom: er.bottom - tr.top };
}
function rectOverlap(a, b, m = 4) {
  return !(a.right + m < b.left || a.left > b.right + m || a.bottom + m < b.top || a.top > b.bottom + m);
}
function pushAway(el, occupied, direction, step = 4, maxIter = 400) {
  let rect = elBox(el);
  let iter = 0;
  while (occupied.some(o => rectOverlap(rect, o)) && iter++ < maxIter) {
    const curTop = parseFloat(el.style.top) || 0;
    el.style.top = (curTop + (direction === 'up' ? -step : step)) + 'px';
    rect = elBox(el);
  }
  occupied.push(rect);
  return rect;
}

function render() {
  timeline.innerHTML = '';
  const totalWidth = LEFT_PAD + totalMonths * pxPerMonth + RIGHT_PAD;
  timeline.style.width = totalWidth + 'px';
  timeline.style.height = '900px';

  const CURVE_R = 14;
  const LANE_H  = 36;
  const ICON_H  = 50; // icon card height + gap above branch
  const DOT_R   = 5;

  // ── lane assignment (greedy, left-to-right) ──────────────────────────────
  const sortedRoles = [...roles].sort((a,b) => toDate(a.start) - toDate(b.start));
  const laneEndX   = [];
  const roleLanes  = new Map();
  sortedRoles.forEach(r => {
    const x1 = xPx(toDate(r.start));
    const x2 = xPx(r.end ? toDate(r.end) : maxDate);
    let lane = -1;
    for (let i = 0; i < laneEndX.length; i++) {
      if (laneEndX[i] + CURVE_R + 6 <= x1) { lane = i; laneEndX[i] = x2; break; }
    }
    if (lane === -1) { lane = laneEndX.length; laneEndX.push(x2); }
    roleLanes.set(r.id, lane);
  });
  const numLanes = laneEndX.length;

  // ── axis Y: enough room for all lanes + icons ─────────────────────────────
  const axisY = ICON_H + numLanes * LANE_H + CURVE_R + 12;
  timeline.style.setProperty('--axis-y', axisY + 'px');

  // ── SVG layer ─────────────────────────────────────────────────────────────
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = `position:absolute;left:0;top:0;width:${totalWidth}px;height:1px;overflow:visible;pointer-events:none;z-index:1;`;
  timeline.appendChild(svg);

  function svgEl(tag, attrs, styles) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs)  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
    if (styles) Object.assign(el.style, styles);
    svg.appendChild(el);
    return el;
  }

  // main trunk line
  svgEl('line', { x1:0, y1:axisY, x2:totalWidth, y2:axisY,
                   'stroke-width':2 }, { stroke:'var(--line)' });

  // ── year ticks ────────────────────────────────────────────────────────────
  const allowedYears = new Set([2000, 2005, 2010, 2015, 2020, 2025]);
  for (let y = minDate.getFullYear(); y <= maxDate.getFullYear(); y++) {
    if (!allowedYears.has(y)) continue;
    const lbl = document.createElement('div');
    lbl.className = 'year-tick' + (y % 10 === 0 ? ' decade' : '');
    lbl.textContent = y;
    lbl.style.left = xPx(new Date(y, 0, 1)) + 'px';
    timeline.appendChild(lbl);
  }

  // ── role color scheme ─────────────────────────────────────────────────────
  const rolesByNewest = [...roles].sort((a,b) => toDate(b.start) - toDate(a.start));
  const roleColorMap  = new Map();
  rolesByNewest.forEach((r, i) => {
    const t = rolesByNewest.length > 1 ? i / (rolesByNewest.length - 1) : 0;
    const sat = Math.round(90 - t * 20), light = Math.round(72 - t * 44);
    roleColorMap.set(r.id, `hsl(212, ${sat}%, ${light}%)`);
  });

  // ── draw role branches ────────────────────────────────────────────────────
  const CARD_W = 40, CARD_H = 40;
  sortedRoles.forEach(r => {
    const x1     = xPx(toDate(r.start));
    const x2     = xPx(r.end ? toDate(r.end) : maxDate);
    const bY     = axisY - LANE_H;   // uniform low branch — GitHub-style hump
    const color  = roleColorMap.get(r.id) || '#58a6ff';
    const x1c    = x1 + CURVE_R;
    const x2c    = x2 - CURVE_R;

    // branch path
    const d = x2c > x1c
      ? `M${x1} ${axisY} C${x1} ${bY} ${x1} ${bY} ${x1c} ${bY} L${x2c} ${bY} C${x2} ${bY} ${x2} ${axisY} ${x2} ${axisY}`
      : `M${x1} ${axisY} C${x1} ${bY} ${x2} ${bY} ${x2} ${axisY}`;

    const path = svgEl('path', { d, fill:'none', 'stroke-width':2, 'stroke-linecap':'round' },
                       { stroke: color, pointerEvents:'all', cursor:'pointer' });
    path.addEventListener('click', () => scrollToCard('role-' + r.id));

    // dots on trunk at start & end
    [x1, x2].forEach(cx => {
      svgEl('circle', { cx, cy:axisY, r:DOT_R, 'stroke-width':2.5 },
            { fill:color, stroke:'var(--bg)' });
    });

    // favicon icon card above branch start
    const card = document.createElement('div');
    card.className = 'role-card';
    card.dataset.id = r.id;
    card.style.left  = x1 + 'px';
    card.style.top   = (bY - CARD_H - 6) + 'px';
    card.innerHTML   = `<img class="logo" src="${r.logo||''}" alt="${r.company}"
      title="${r.company} — ${r.title}" onerror="this.classList.add('missing')">`;
    card.addEventListener('click', () => scrollToCard('role-' + r.id));
    timeline.appendChild(card);
  });

  // ── projects (thin sub-branches if enabled) ───────────────────────────────
  if (showProjects) {
    projects.forEach(p => {
      const parent = roles.find(r => r.id === p.parent);
      if (!parent) return;
      const bY    = axisY - LANE_H;
      const subY  = bY - 12;
      const x1    = xPx(toDate(p.start));
      const x2    = xPx(p.end ? toDate(p.end) : maxDate);
      svgEl('line', { x1, y1:subY, x2, y2:subY, 'stroke-width':1.5, 'stroke-dasharray':'4 3' },
            { stroke: 'var(--c-project)' });
      [x1, x2].forEach(cx =>
        svgEl('circle', { cx, cy:subY, r:3 }, { fill:'var(--c-project)', stroke:'var(--bg)', 'stroke-width':'1.5' })
      );
    });
  }

  // ── skill bands (below axis) — git-branch style ──────────────────────────
  const SKILL_BELOW_Y = axisY + 38;
  const SKILL_ROW_H   = 36;
  const occBelow      = [];
  skillBands.forEach((s, i) => {
    const left  = xPx(toDate(s.start));
    const right = xPx(s.end ? toDate(s.end) : maxDate);
    const bY    = SKILL_BELOW_Y + i * SKILL_ROW_H;
    const color = s.color || 'var(--accent)';
    const x1c   = left + CURVE_R;
    const x2c   = right - CURVE_R;

    const d = x2c > x1c
      ? (s.openEnd
          ? `M${left} ${axisY} C${left} ${bY} ${left} ${bY} ${x1c} ${bY} L${right} ${bY}`
          : `M${left} ${axisY} C${left} ${bY} ${left} ${bY} ${x1c} ${bY} L${x2c} ${bY} C${right} ${bY} ${right} ${axisY} ${right} ${axisY}`)
      : `M${left} ${axisY} C${left} ${bY} ${right} ${bY} ${right} ${axisY}`;

    svgEl('path', { d, fill:'none', 'stroke-width':2, 'stroke-linecap':'round' },
          { stroke: color });
    // start dot on trunk
    svgEl('circle', { cx: left, cy: axisY, r: DOT_R, 'stroke-width':2.5 },
          { fill: color, stroke: 'var(--bg)' });
    // end dot — on trunk if branch closes, otherwise on the open branch tip
    svgEl('circle', { cx: right, cy: s.openEnd ? bY : axisY, r: DOT_R, 'stroke-width':2.5 },
          { fill: color, stroke: 'var(--bg)' });

    const lbl = document.createElement('div');
    lbl.className = 'skill-band-label';
    lbl.textContent = `${s.icon||''} ${s.label} · ${durationLabel(s.start, s.end)}`;
    lbl.style.left      = ((left + right) / 2) + 'px';
    lbl.style.top       = (bY + 8) + 'px';
    lbl.style.transform = 'translateX(-50%)';
    if (s.color) { lbl.style.color = s.color; lbl.style.borderColor = hexToRgba(s.color,.5); }
    timeline.appendChild(lbl);
    occBelow.push(elBox(lbl));
    pushAway(lbl, occBelow, 'down');
  });

  // ── milestones ────────────────────────────────────────────────────────────
  const sortedMilestones = [...milestones]
    .filter(m => { if (m.isExam) return showExams; if (m.isTraining) return showTraining; return true; })
    .sort((a,b) => toDate(a.date) - toDate(b.date));

  const milestoneLabels = [];
  sortedMilestones.forEach((m, idx) => {
    const x = xPx(toDate(m.date));
    const typeColor = m.isExam ? 'var(--c-exam)' : (m.isTraining ? 'var(--c-train)' : 'var(--c-mile)');

    const dot = svgEl('circle', { cx:x, cy:axisY, r:DOT_R, 'stroke-width':2.5 },
                      { fill:typeColor, stroke:'var(--bg)', pointerEvents:'all', cursor:'pointer' });
    dot.addEventListener('click', () => scrollToCard('mile-' + idx));

    const lbl = document.createElement('div');
    lbl.className = 'milestone-label';
    lbl.style.cssText += `cursor:pointer;border-color:${typeColor};color:${typeColor}`;
    lbl.addEventListener('click', () => scrollToCard('mile-' + idx));
    const logoHtml = m.logo
      ? `<img src="${m.logo}" style="width:24px;height:24px;border-radius:4px;background:#fff;padding:2px;display:block;margin:0 auto 4px" onerror="this.style.display='none'">`
      : `<span class="icon">${m.icon}</span>`;
    lbl.innerHTML = `${logoHtml}${m.label}`;
    lbl.style.left = x + 'px';
    lbl.style.top  = (axisY + 20) + 'px';
    timeline.appendChild(lbl);
    pushAway(lbl, occBelow, 'down');
    milestoneLabels.push({ lbl, x });
  });

  // pins from axis dot to labels
  milestoneLabels.forEach(({ lbl, x }) => {
    const box = elBox(lbl);
    const pin = document.createElement('div');
    pin.className   = 'milestone-pin';
    pin.style.left  = (x-1) + 'px';
    pin.style.top   = axisY + 'px';
    pin.style.height = Math.max(0, box.top - axisY - 2) + 'px';
    timeline.appendChild(pin);
  });

  // ── final height ──────────────────────────────────────────────────────────
  let maxBottom = axisY + 80;
  occBelow.forEach(b => { if (b.bottom > maxBottom) maxBottom = b.bottom; });
  timeline.style.height = (maxBottom + 24) + 'px';
}

render();

// --- card list (vertical, newest first) ---
const cardList = document.getElementById('cardList');
function scrollToCard(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1500);
}
function buildCardList() {
  const sortedMilestones = [...milestones]
    .filter(m => {
      if (m.isExam) return showExams;
      if (m.isTraining) return showTraining;
      return true;
    });
  const items = [];
  roles.forEach(r => items.push({ kind: 'role', date: r.start, sortDate: r.end || '9999-12', data: r }));
  if (showProjects) projects.forEach(p => items.push({ kind: 'project', date: p.start, sortDate: p.end || '9999-12', data: p }));
  sortedMilestones.forEach((m, idx) => items.push({ kind: 'mile', date: m.date, sortDate: m.date, data: m, idx }));
  items.sort((a,b) => toDate(b.sortDate) - toDate(a.sortDate));

  // bright (newest) → dark (oldest) blue scale based on item start date
  const itemDate = it => toDate(it.kind === 'mile' ? it.data.date : it.data.start);
  const dates = items.map(itemDate);
  const minTs = Math.min(...dates), maxTs = Math.max(...dates);
  // bright newest, dark oldest
  const newColor = { r: 88, g: 166, b: 255 };   // #58a6ff
  const oldColor = { r: 13, g: 36,  b: 81  };   // deep navy
  function ageBg(it) {
    const t = (itemDate(it) - minTs) / (maxTs - minTs || 1); // 0=old → 1=new
    const lerp = (a,b) => Math.round(a + (b - a) * t);
    const r = lerp(oldColor.r, newColor.r);
    const g = lerp(oldColor.g, newColor.g);
    const b = lerp(oldColor.b, newColor.b);
    // darken slightly so text stays readable
    const f = 0.55;
    return `rgb(${Math.round(r*f)}, ${Math.round(g*f)}, ${Math.round(b*f)})`;
  }

  cardList.innerHTML = items.map(it => {
    const bg = ageBg(it);
    const styleAttr = `style="background:${bg}"`;
    if (it.kind === 'role') {
      const r = it.data;
      const logoImg = r.logo ? `<img class="cl-logo" src="${r.logo}" alt="" onerror="this.style.display='none'">` : '';
      const bullets = (r.bullets || []).map(b => `<li>${b}</li>`).join('');
      const clients = (r.clients && r.clients.length)
        ? `<div class="cl-block"><h5>Clients</h5>${r.clients.map(c => `<span class="cl-chip"><img src="${c.logo}" alt="" onerror="this.style.display='none'">${c.name}</span>`).join('')}</div>`
        : '';
      const tags = (r.tags && r.tags.length)
        ? `<div class="cl-block"><h5>Skills &amp; Tech</h5>${r.tags.map(t => `<span class="cl-tag">${t}</span>`).join('')}</div>`
        : '';
      return `<article class="cl-card cl-role ${r.cls || ''}" id="role-${r.id}" ${styleAttr}>
        <header class="cl-head">${logoImg}
          <div><div class="cl-company">${r.company}${r.contract ? '<span class="contract-badge">Contract</span>' : ''}</div>
          <div class="cl-title">${r.title}</div></div></header>
        <div class="cl-meta">${fmtRange(r.start, r.end)} · ${durationLabel(r.start, r.end)}</div>
        <ul class="cl-bullets">${bullets}</ul>
        <div class="cl-section">${clients}${tags}</div>
      </article>`;
    }
    if (it.kind === 'project') {
      const p = it.data;
      return `<article class="cl-card cl-project ${p.cls || ''}" id="project-${(p.title||'').replace(/\s+/g,'-')}" ${styleAttr}>
        <header class="cl-head"><div><div class="cl-company">${p.icon || '🔹'} ${p.title}</div>
        <div class="cl-title">Project</div></div></header>
        <div class="cl-meta">${fmtRange(p.start, p.end)} · ${durationLabel(p.start, p.end)}</div>
        ${p.desc ? `<p>${p.desc}</p>` : ''}
      </article>`;
    }
    // milestone
    const m = it.data;
    const typeLabel = m.isExam ? 'Certification / Exam' : (m.isTraining ? 'Training' : 'Milestone');
    const logoHtml = m.logo
      ? `<img class="cl-logo" src="${m.logo}" alt="" onerror="this.style.display='none'">`
      : `<div class="cl-logo cl-icon">${m.icon || '📌'}</div>`;
    return `<article class="cl-card cl-mile ${m.isExam ? 'cl-exam' : ''} ${m.isTraining ? 'cl-train' : ''}" id="mile-${it.idx}" ${styleAttr}>
      <header class="cl-head">${logoHtml}
        <div><div class="cl-company">${m.label}</div>
        <div class="cl-title">${typeLabel}</div></div></header>
      <div class="cl-meta">${fmtRange(m.date, m.date)}</div>
    </article>`;
  }).join('');
}

const toggleExamsBtn = document.getElementById('toggleExams');
toggleExamsBtn.addEventListener('click', () => {
  showExams = !showExams;
  toggleExamsBtn.classList.toggle('active', showExams);
  toggleExamsBtn.textContent = showExams ? '🎓 Hide certifications' : '🎓 Show certifications';
  render();
  buildCardList();
});
const toggleProjectsBtn = document.getElementById('toggleProjects');
toggleProjectsBtn.addEventListener('click', () => {
  showProjects = !showProjects;
  toggleProjectsBtn.classList.toggle('active', showProjects);
  toggleProjectsBtn.textContent = showProjects ? '🔹 Hide projects' : '🔹 Show projects';
  render();
  buildCardList();
});
const toggleTrainingBtn = document.getElementById('toggleTraining');
if (toggleTrainingBtn) {
  toggleTrainingBtn.addEventListener('click', () => {
    showTraining = !showTraining;
    toggleTrainingBtn.classList.toggle('active', showTraining);
    toggleTrainingBtn.textContent = showTraining ? '⚙️ Hide training' : '⚙️ Show training';
    render();
  });
}

// --- skill filters ---
const legend = document.getElementById('legend');
// curated/normalised top skills with display names
const skillGroups = [
  { label: 'C#',           match: ['c#'] },
  { label: '.NET',         match: ['.net'] },
  { label: 'Angular',      match: ['angular'] },
  { label: 'SQL Server',   match: ['sql server', 'sql 2008', 'sql'] },
  { label: 'Azure',        match: ['azure batch', 'azure storage', 'azure'] },
  { label: 'Power BI',     match: ['power bi'] },
  { label: 'Kubernetes',   match: ['kubernetes'] },
  { label: 'Microsoft Fabric', match: ['microsoft fabric', 'fabric'] },
  { label: 'Event Sourcing',   match: ['event sourcing'] },
  { label: 'CI/CD',        match: ['ci/cd', 'teamcity'] },
  { label: 'Testing',      match: ['nunit', 'selenium', 'unit tests'] },
  { label: 'ASP.NET MVC',  match: ['asp.net mvc 3', 'asp.net mvc'] },
  { label: 'Consultancy',  match: ['consultancy'] },
];

function rolesMatchingSkill(group) {
  const tokens = group.match.map(t => t.toLowerCase());
  return roles.filter(r => (r.tags || []).some(tag => {
    const t = tag.toLowerCase();
    return tokens.some(tok => t === tok || t.includes(tok));
  })).map(r => r.id);
}

let activeSkill = null;
function applySkillFilter() {
  const matchingIds = activeSkill ? rolesMatchingSkill(activeSkill) : null;
  document.querySelectorAll('.role-bar, .role-card').forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('dim', !!matchingIds && !matchingIds.includes(id));
  });
}

skillGroups.forEach(group => {
  if (rolesMatchingSkill(group).length === 0) return;
  const s = document.createElement('span');
  s.textContent = group.label;
  s.addEventListener('click', () => {
    if (activeSkill === group) {
      activeSkill = null;
      legend.querySelectorAll('span').forEach(el => el.classList.remove('active'));
    } else {
      activeSkill = group;
      legend.querySelectorAll('span').forEach(el => el.classList.remove('active'));
      s.classList.add('active');
    }
    applySkillFilter();
  });
  legend.appendChild(s);
});

// re-apply filter after every render (zoom rebuilds elements)
const _origRender = render;
render = function() { _origRender.apply(this, arguments); applySkillFilter(); buildCardList(); };
buildCardList();

// --- modal ---
const modalBg = document.getElementById('modalBg');
function openModal(r) {
  const logoImg = r.logo ? `<img src="${r.logo}" alt="" style="width:36px;height:36px;border-radius:6px;background:#fff;padding:3px;vertical-align:middle;margin-right:10px;object-fit:contain" onerror="this.style.display='none'">` : '';
  document.getElementById('mTitle').innerHTML = logoImg + r.company;
  document.getElementById('mCompany').textContent = r.title;
  document.getElementById('mMeta').textContent = `${fmtRange(r.start, r.end)} · ${durationLabel(r.start, r.end)}`;
  const ul = document.getElementById('mList');
  ul.innerHTML = '';
  r.bullets.forEach(b => { const li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
  const clientsHeader = document.getElementById('mClientsHeader');
  const clientsList = document.getElementById('mClients');
  clientsList.innerHTML = '';
  if (r.clients && r.clients.length) {
    clientsHeader.style.display = '';
    r.clients.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `<img src="${c.logo}" alt="" onerror="this.style.display='none'">${c.name}`;
      clientsList.appendChild(chip);
    });
  } else {
    clientsHeader.style.display = 'none';
  }
  const tags = document.getElementById('mTags');
  tags.innerHTML = '';
  r.tags.forEach(t => { const s = document.createElement('span'); s.textContent = t; tags.appendChild(s); });
  modalBg.classList.add('open');
}
document.getElementById('closeBtn').addEventListener('click', () => modalBg.classList.remove('open'));
modalBg.addEventListener('click', e => { if (e.target === modalBg) modalBg.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modalBg.classList.remove('open'); });

// auto-reflow on resize — width-only & debounced (avoid reload thrash on mobile
// where the URL bar collapsing changes height)
let _lastW = window.innerWidth;
let _resizeT = null;
window.addEventListener('resize', () => {
  if (window.innerWidth === _lastW) return;
  _lastW = window.innerWidth;
  clearTimeout(_resizeT);
  _resizeT = setTimeout(() => location.reload(), 250);
});
// --- theme toggle ---
const themeToggle = document.getElementById('themeToggle');
function applyTheme(t) {
  if (t === 'light') { document.documentElement.setAttribute('data-theme', 'light'); themeToggle.textContent = '☀️'; }
  else { document.documentElement.removeAttribute('data-theme'); themeToggle.textContent = '🌙'; }
}
applyTheme(localStorage.getItem('theme') || 'dark');
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

</script>
